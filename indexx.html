<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Орфографический тренажёр — Причастия</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#eef2ff,#f8fafc);color:#172033;min-height:100vh}
.app{max-width:900px;margin:0 auto;padding:28px 18px 45px}.card{background:white;border-radius:24px;padding:28px;box-shadow:0 15px 45px rgba(31,41,55,.10)}
h1{margin:0 0 8px;font-size:30px}.subtitle{color:#64748b;margin:0 0 24px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:18px}
.badge{display:inline-block;padding:8px 13px;border-radius:999px;background:#eef2ff;color:#4338ca;font-weight:700;font-size:14px}
.progress{height:9px;background:#e5e7eb;border-radius:10px;overflow:hidden;margin-bottom:28px}.bar{height:100%;background:#4f46e5;width:0;transition:.3s}
.question{font-size:22px;font-weight:700;line-height:1.4;margin:20px 0}.hint{color:#64748b;font-size:15px;margin-bottom:18px}.options{display:grid;gap:12px}
button.option{border:2px solid #e5e7eb;background:#fff;border-radius:15px;padding:15px 17px;text-align:left;font-size:17px;cursor:pointer;transition:.18s}
button.option:hover:not(:disabled){border-color:#818cf8;background:#f8f7ff;transform:translateY(-1px)}button.option:disabled{cursor:default}
.correct{border-color:#16a34a!important;background:#f0fdf4!important}.wrong{border-color:#dc2626!important;background:#fef2f2!important}
.feedback{margin-top:20px;padding:18px;border-radius:16px;display:none;line-height:1.5}.feedback.good{display:block;background:#f0fdf4;border:1px solid #bbf7d0}.feedback.bad{display:block;background:#fef2f2;border:1px solid #fecaca}
.feedback strong{display:block;margin-bottom:5px}.next,.restart{margin-top:18px;border:0;background:#4f46e5;color:white;border-radius:13px;padding:13px 20px;font-size:16px;font-weight:700;cursor:pointer}
.next:hover,.restart:hover{background:#4338ca}.hidden{display:none}.result{text-align:center}.score{font-size:54px;font-weight:800;color:#4f46e5;margin:12px 0}.result p{color:#64748b}
.topics{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 25px}.topic{padding:7px 10px;background:#f1f5f9;border-radius:10px;color:#475569;font-size:13px}
@media(max-width:600px){.card{padding:20px}.question{font-size:19px}h1{font-size:25px}}
</style></head><body><div class="app">
<div class="card" id="quiz"><div class="top"><div><h1>Орфографический тренажёр</h1><p class="subtitle">Правописание действительных и страдательных причастий</p></div><div class="badge" id="counter">1 / 20</div></div>
<div class="topics"><span class="topic">Действительные причастия</span><span class="topic">Страдательные причастия</span><span class="topic">Н и НН</span><span class="topic">Суффиксы</span></div>
<div class="progress"><div class="bar" id="bar"></div></div><div id="question"></div><div id="options" class="options"></div><div id="feedback" class="feedback"></div><button id="next" class="next hidden">Следующий вопрос →</button></div>
<div class="card result hidden" id="result"><h1>Тест завершён!</h1><div class="score" id="score"></div><p id="resultText"></p><button class="restart" onclick="startQuiz()">Пройти ещё раз</button></div>
</div>
<script>
const questions = [{"type": "Действительное причастие", "q": "Выберите правильное написание:", "sentence": "К берегу подошёл ___ к лодке мальчик.", "options": ["подбежавший", "подбежевший", "подбежавщий", "подбежавшый"], "answer": 0, "rule": "От глагола «подбежать» образуется причастие прошедшего времени «подбежавший» с суффиксом -вш-."}, {"type": "Страдательное причастие", "q": "Выберите правильное написание:", "sentence": "На полке лежала книга, давно ___ мной.", "options": ["прочитаная", "прочитанная", "прочетанная", "прочитаннная"], "answer": 1, "rule": "Полное страдательное причастие прошедшего времени «прочитанная» пишется с НН."}, {"type": "Страдательное причастие", "q": "Как правильно написать слово?", "sentence": "В саду стояла ___ беседка.", "options": ["покрашеная", "покрашенная", "покрашинная", "покрашеннная"], "answer": 1, "rule": "Полное страдательное причастие прошедшего времени «покрашенная» пишется с НН."}, {"type": "Действительное причастие", "q": "Выберите правильный вариант:", "sentence": "___ поезд уже скрылся за поворотом.", "options": ["Отъезжаюший", "Отъезжающий", "Отъезжаещий", "Отъезжающый"], "answer": 1, "rule": "От глагола «отъезжать» образуется причастие настоящего времени «отъезжающий» с суффиксом -ющ-."}, {"type": "Страдательное причастие", "q": "Выберите правильное написание:", "sentence": "На столе лежал ___ лист.", "options": ["подписаный", "подписанный", "подписаннный", "подписаныйй"], "answer": 1, "rule": "Полное страдательное причастие от глагола «подписать» — «подписанный», с НН."}, {"type": "Действительное причастие", "q": "Как правильно?", "sentence": "___ спортсмены быстро финишировали.", "options": ["Бегущии", "Бегущие", "Бежащие", "Бегаюшие"], "answer": 1, "rule": "От глагола «бежать» образуется действительное причастие «бегущий», множественное число — «бегущие»."}, {"type": "Страдательное причастие", "q": "Выберите правильный вариант:", "sentence": "Это хорошо ___ произведение.", "options": ["написаное", "написанное", "написинное", "написаннное"], "answer": 1, "rule": "Полное страдательное причастие от «написать» — «написанное», с НН."}, {"type": "Действительное причастие", "q": "Как правильно написать?", "sentence": "___ листья кружились в воздухе.", "options": ["Опавшые", "Опавшие", "Опавшии", "Опавше"], "answer": 1, "rule": "От глагола «опасть» образуется причастие прошедшего времени «опавший», множественное число — «опавшие»."}, {"type": "Страдательное причастие", "q": "Выберите правильное написание:", "sentence": "На стене висела ___ картина.", "options": ["нарисованая", "нарисованная", "нарисованнная", "наресованная"], "answer": 1, "rule": "Полное страдательное причастие от «нарисовать» — «нарисованная», с НН."}, {"type": "Действительное причастие", "q": "Выберите правильный вариант:", "sentence": "___ на помощь спасатель быстро вошёл в дом.", "options": ["Прибежевший", "Прибежавший", "Прибежавщий", "Прибежавшый"], "answer": 1, "rule": "От глагола «прибежать» образуется причастие прошедшего времени «прибежавший» с суффиксом -вш-."}, {"type": "Страдательное причастие", "q": "Выберите правильное написание:", "sentence": "В шкафу хранился ___ документ.", "options": ["провереный", "проверенный", "проверинный", "провереннный"], "answer": 1, "rule": "Полное страдательное причастие прошедшего времени «проверенный» пишется с НН."}, {"type": "Действительное причастие", "q": "Как правильно?", "sentence": "___ человек внимательно слушал лекцию.", "options": ["Сидяший", "Сидящий", "Сидещий", "Сидящийй"], "answer": 1, "rule": "От глагола «сидеть» образуется действительное причастие «сидящий» с суффиксом -ящ-."}, {"type": "Страдательное причастие", "q": "Выберите правильный вариант:", "sentence": "В комнате стоял недавно ___ шкаф.", "options": ["собраный", "собранный", "собраннный", "собронный"], "answer": 1, "rule": "Полное страдательное причастие от «собрать» — «собранный», с НН."}, {"type": "Действительное причастие", "q": "Выберите правильное написание:", "sentence": "___ над городом самолёт быстро набирал высоту.", "options": ["Пролетаюший", "Пролетающий", "Пролетаещий", "Пролетающый"], "answer": 1, "rule": "От глагола «пролетать» образуется причастие настоящего времени «пролетающий» с суффиксом -ющ-."}, {"type": "Страдательное причастие", "q": "Выберите правильное написание:", "sentence": "На выставке представили ___ недавно макет.", "options": ["построеный", "построенный", "построинный", "пастроенный"], "answer": 1, "rule": "Полное страдательное причастие от «построить» — «построенный», с НН."}, {"type": "Действительное причастие", "q": "Выберите правильный вариант:", "sentence": "___ к финишу бегун ускорился.", "options": ["Приближаюшийся", "Приближающийся", "Приближаещийся", "Приближающися"], "answer": 1, "rule": "От «приближаться» образуется действительное причастие настоящего времени «приближающийся»."}, {"type": "Страдательное причастие", "q": "Как правильно?", "sentence": "На доске было написано хорошо ___ правило.", "options": ["объяснёное", "объяснённое", "объясненое", "объяснённное"], "answer": 1, "rule": "Полное страдательное причастие «объяснённое» пишется с НН."}, {"type": "Действительное причастие", "q": "Выберите правильное написание:", "sentence": "___ по дороге путник остановился у реки.", "options": ["Идуший", "Идущий", "Идящий", "Идущийй"], "answer": 1, "rule": "От глагола «идти» образуется действительное причастие настоящего времени «идущий»."}, {"type": "Страдательное причастие", "q": "Выберите правильный вариант:", "sentence": "На столе лежало ___ письмо.", "options": ["отправленое", "отправленное", "отправленнное", "атправленное"], "answer": 1, "rule": "Полное страдательное причастие прошедшего времени «отправленное» пишется с НН."}, {"type": "Действительное причастие", "q": "Выберите правильный вариант:", "sentence": "___ к окну кот наблюдал за птицами.", "options": ["Подходевший", "Подходящий", "Подходящийй", "Подходюший"], "answer": 1, "rule": "От глагола «подходить» образуется действительное причастие настоящего времени «подходящий»."}];
let current=0, score=0, answered=false, quizQuestions=[];
function shuffleQuestions(){
 quizQuestions=questions.map(item=>{
   const choices=item.options.map((text,index)=>({text,correct:index===item.answer}));
   for(let i=choices.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[choices[i],choices[j]]=[choices[j],choices[i]];}
   return {...item,options:choices.map(c=>c.text),answer:choices.findIndex(c=>c.correct)};
 });
}
function startQuiz(){current=0;score=0;answered=false;shuffleQuestions();document.getElementById("quiz").classList.remove("hidden");document.getElementById("result").classList.add("hidden");render();}
function render(){
 const item=quizQuestions[current];document.getElementById("counter").textContent=`${current+1} / ${quizQuestions.length}`;document.getElementById("bar").style.width=`${current/quizQuestions.length*100}%`;
 document.getElementById("question").innerHTML=`<div class="badge">${item.type}</div><div class="question">${item.q}<br>${item.sentence}</div><div class="hint">Выберите один вариант ответа.</div>`;
 const box=document.getElementById("options");box.innerHTML="";
 item.options.forEach((opt,i)=>{const b=document.createElement("button");b.className="option";b.textContent=opt;b.onclick=()=>choose(i);box.appendChild(b);});
 const f=document.getElementById("feedback");f.className="feedback";f.innerHTML="";document.getElementById("next").classList.add("hidden");answered=false;
}
function choose(i){
 if(answered)return;answered=true;const item=quizQuestions[current];const buttons=[...document.querySelectorAll(".option")];buttons.forEach(b=>b.disabled=true);buttons[item.answer].classList.add("correct");
 const f=document.getElementById("feedback");
 if(i===item.answer){score++;f.className="feedback good";f.innerHTML="<strong>✓ Правильно!</strong>"+item.rule;}
 else{buttons[i].classList.add("wrong");f.className="feedback bad";f.innerHTML=`<strong>✗ Неверно.</strong>Правильный ответ: <b>${item.options[item.answer]}</b><br>${item.rule}`;}
 document.getElementById("next").classList.remove("hidden");
}
document.getElementById("next").onclick=()=>{current++;if(current<quizQuestions.length)render();else finish();};
function finish(){document.getElementById("quiz").classList.add("hidden");document.getElementById("result").classList.remove("hidden");const pct=Math.round(score/quizQuestions.length*100);document.getElementById("score").textContent=`${score} из ${quizQuestions.length}`;const t=pct>=90?"Отличный результат! Вы уверенно владеете правописанием причастий.":pct>=70?"Хороший результат! Повторите правила по вопросам, где были ошибки.":pct>=50?"Есть база, но стоит повторить образование и правописание причастий.":"Рекомендуем повторить правила и пройти тренажёр ещё раз.";document.getElementById("resultText").textContent=`${pct}% правильных ответов. ${t}`;}
startQuiz();
</script></body></html>
